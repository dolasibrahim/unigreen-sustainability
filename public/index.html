<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGreen Harran | Karbon Ayak İzi ve Sürdürülebilirlik Analiz Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --secondary: #14b8a6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 0;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 20px rgba(15, 118, 110, 0.1);
            margin-bottom: -40px;
        }

        .header h1 { font-weight: 800; letter-spacing: -1px; }

        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 60px;
            margin-bottom: 30px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .menu-card.active {
            border-color: var(--primary);
            background: #f0fdfa;
        }

        .menu-card i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 12px;
            display: block;
        }

        .calculator-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        .btn-calculate {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            margin-top: 30px;
            transition: 0.3s;
        }

        .btn-calculate:hover { background: #0f172a; }

        .result-container {
            margin-top: 40px;
            background: #f0fdf4;
            border: 2px solid #86efac;
            border-radius: 20px;
            padding: 30px;
            display: none;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            color: #166534;
        }

        .result-header i { font-size: 36px; }
        .result-header h3 { margin: 0; font-weight: 800; }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px dashed #bbf7d0;
            font-size: 17px;
            font-weight: 600;
            color: #064e3b;
        }

        .result-row:last-child { border-bottom: none; }

        .tree-badge {
            background: #166534;
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-top: 25px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fa-solid fa-leaf"></i> UniGreen Harran</h1>
    <p class="lead mt-2">Karbon Ayak İzi ve Sürdürülebilirlik Analiz Sistemi</p>
</div>

<div class="main-container">
    <div class="menu-grid" id="menuArea"></div>

    <div class="calculator-card">
        <h3 id="moduleTitle" class="mb-4" style="font-weight: 800; color: var(--primary);"></h3>

        <div class="row" id="formArea"></div>

        <button class="btn-calculate" onclick="calculateData()">
            <i class="fa-solid fa-calculator me-2"></i> ANALİZİ BAŞLAT
        </button>

        <div class="result-container" id="resultArea">
            <div class="result-header">
                <i class="fa-solid fa-chart-pie"></i>
                <h3>Sürdürülebilirlik Raporu</h3>
            </div>
            <div id="resultContent"></div>
        </div>
    </div>
</div>

<script>
    // 15 Modül Tanımlamaları - BİLİMSEL VERİ İHTİYAÇLARINA GÖRE GÜNCELLENDİ
    const modules = [
        { id: "personal", icon: "fa-user", name: "Kişisel Karbon", fields: { ulasim: "Yıllık Araç Kullanımı (km)", elek: "Aylık Elektrik (kWh)", gas: "Aylık Doğalgaz (m³)", flightKm: "Yıllık Uçuş (km)", beslenmeTarzi: "Beslenme Tarzı" } },
        { id: "corporate", icon: "fa-building", name: "Kurumsal Karbon", fields: { cElek: "Yıllık Elektrik (kWh)", cGas: "Yıllık Doğalgaz (m³)", cFilo: "Araç Filosu Yakıtı (Litre)", paper: "Yıllık Kağıt Tüketimi (kg)", emp: "Çalışan Sayısı" } },
        { id: "event", icon: "fa-calendar-check", name: "Etkinlik Karbon", fields: { participants: "Katılımcı Sayısı", dist: "Ort. Katılımcı Mesafesi (km)", days: "Etkinlik Süresi (Gün)", foodFactor: "Yemek Karbon Katsayısı (kg/gün)", hotelNights: "Toplam Otel Gecelemesi (Adet)" } },
        { id: "water", icon: "fa-droplet", name: "Su Ayak İzi", fields: { dus: "Duş Süresi (dk/gün)", dis: "Diş Fırçalama (dk/gün)", bulasik: "Bulaşık Yıkama (dk/gün)", camasir: "Haftalık Çamaşır Mak. (Yıkama)", icme: "Günlük İçme Suyu (Litre)", et: "Günlük Et Tüketimi (Gram)", tahil: "Günlük Tahıl Tüketimi (Gram)", sut: "Günlük Süt Ürünü (Gram)" } },
        { id: "energy_efficiency", icon: "fa-lightbulb", name: "LED Verimliliği", fields: { oldW: "Geleneksel Ampul (Watt)", ledW: "LED Ampul (Watt)", lCount: "Ampul Sayısı", lHours: "Günlük Kullanım (Saat)" } },
        { id: "home_energy", icon: "fa-house", name: "Ev Enerji", fields: { hBill: "Ortalama Aylık Fatura (TL)", hCost: "Yalıtım/Sistem Maliyeti (TL)", hSavingPct: "Beklenen Enerji Tasarrufu (%)" } },
        { id: "ev", icon: "fa-car", name: "Elek. Araç Analizi", fields: { evKm: "Yıllık Mesafe (km)", evCons: "EV Tüketimi (kWh/100km)", gasCons: "Benzinli Tüketimi (L/100km)", dieselCons: "Dizel Tüketimi (L/100km)", evPrice: "Elektrikli Araç Fiyatı (TL)", icPrice: "Kıyaslanan Araç Fiyatı (TL)" } },
        { id: "transport_comp", icon: "fa-bus", name: "Ulaşım Kıyası", fields: { tDist: "Günlük Gidiş-Dönüş Mesafe (km)", tDays: "Haftalık Kullanım Günü" } },
        { id: "food", icon: "fa-utensils", name: "Gıda Karbon", fields: { fRed: "Haftalık Kırmızı Et (kg)", fWhite: "Haftalık Beyaz Et (kg)", fFish: "Haftalık Balık (kg)", fLocal: "Yerel Ürün Oranı (%)", fSeason: "Mevsimsel Ürün Oranı (%)", fOrg: "Organik Ürün Oranı (%)" } },
        { id: "waste", icon: "fa-trash-can", name: "Atık Yönetimi", fields: { wPlast: "Günlük Plastik Atık (kg)", wPaper: "Günlük Kağıt Atık (kg)", wOrg: "Günlük Organik Atık (kg)", rPlast: "Plastik Dönüşüm Oranı (%)", rPaper: "Kağıt Dönüşüm Oranı (%)", rOrg: "Organik Kompost Oranı (%)" } },
        { id: "paper", icon: "fa-print", name: "Kağıt Tasarrufu", fields: { pCount: "Aylık A4 Çıktı Sayısı (Adet)", pRecycled: "Mevcut Geri Dönüşümlü Kağıt (%)", pTarget: "Dijitalleşme/Azaltım Hedefi (%)" } },
        { id: "green_space", icon: "fa-tree", name: "Yeşil Alan", fields: { gArea: "Kampüs/Bölge Alanı (m²)", gTrees: "Mevcut Ağaç Sayısı", gNew: "Yeni Dikilecek Ağaç Sayısı" } },
        { id: "climate_impact", icon: "fa-earth-europe", name: "İklim Etkisi", fields: { cFootprint: "Yıllık Karbon Ayak İziniz (kg)", cLife: "Ortalama Yaşam Beklentisi (Yıl)" } },
        { id: "campus", icon: "fa-school", name: "Kampüs Analizi", fields: { cBldgA: "Eğitim Binaları Tüketimi (kWh)", cBldgB: "İdari Binalar Tüketimi (kWh)", cStudent: "Toplam Öğrenci Sayısı", cCarPct: "Özel Araç Kullanan Oranı (%)", cWater: "Kampüs Günlük Su (Litre)" } },
        { id: "cafeteria", icon: "fa-mug-hot", name: "Kafeterya Skoru", fields: { meals: "Günlük Servis Edilen Öğün Sayısı", organic: "Organik/Vegan Menü Oranı (%)", recycle: "Gıda Atığı Kompost Oranı (%)", local: "Yerel Tedarik Oranı (%)" } }
    ];

    let currentModule = "personal";

    function initApp() {
        const menuHtml = modules.map(m => `
                <div class="menu-card ${currentModule === m.id ? 'active' : ''}" onclick="changeModule('${m.id}')">
                    <i class="fa-solid ${m.icon}"></i>
                    <span>${m.name}</span>
                </div>
            `).join('');
        document.getElementById("menuArea").innerHTML = menuHtml;
        buildForm();
    }

    function changeModule(id) {
        currentModule = id;
        initApp();
    }

    function buildForm() {
        const mod = modules.find(x => x.id === currentModule);
        document.getElementById("moduleTitle").innerText = mod.name + " Hesaplama Modülü";
        document.getElementById("resultArea").style.display = "none";

        let formHtml = "";
        for (const [inputId, inputLabel] of Object.entries(mod.fields)) {

            if (inputId === "beslenmeTarzi") {
                formHtml += `
                        <div class="col-md-4 mb-3">
                            <label class="form-label">${inputLabel}</label>
                            <select id="${inputId}" class="form-select input-field">
                                <option value="1">Vegan Diyet</option>
                                <option value="2">Vejetaryen Diyet</option>
                                <option value="3" selected>Karışık Diyet (Ortalama)</option>
                                <option value="4">Yoğun Kırmızı Et Tüketimi</option>
                            </select>
                        </div>
                    `;
            } else {
                formHtml += `
                        <div class="col-md-4 mb-3">
                            <label class="form-label">${inputLabel}</label>
                            <input type="number" id="${inputId}" class="form-control input-field" placeholder="Örn: 0" min="0">
                        </div>
                    `;
            }
        }
        document.getElementById("formArea").innerHTML = formHtml;
    }

    async function calculateData() {
        const dataPayload = {};
        document.querySelectorAll(".input-field").forEach(input => {
            dataPayload[input.id] = parseFloat(input.value) || 0;
        });

        try {
            const response = await fetch(`/api/calculate/${currentModule}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataPayload)
            });

            const res = await response.json();

            if (res.success) {
                renderResult(res);
            } else {
                alert("Hesaplama sırasında bir hata oluştu: " + res.error);
            }
        } catch (err) {
            alert("Sunucuya bağlanılamadı. Node.js sunucusunun çalıştığından emin olun.");
            console.error(err);
        }
    }

    function renderResult(res) {
        document.getElementById("resultArea").style.display = "block";
        let resultHtml = "";

        Object.keys(res).forEach(key => {
            if (key !== "success" && key !== "total" && key !== "trees") {
                resultHtml += `
                        <div class="result-row">
                            <span>${key}</span>
                            <span>${res[key]}</span>
                        </div>
                    `;
            }
        });

        let birim = currentModule === "water" ? "Litre Su Ayak İzi" : "kg CO₂ Eşdeğeri Emisyon";
        let agacAciklamasi = currentModule === "water" ? "Su tasarrufu için günlük kullanım alışkanlıkları değiştirilmelidir." : `Bunu nötrlemek için: ${res.trees} Ağaç dikilmelidir.`;

        // Atık gibi modüllerde direkt "önlenen" hesabı olduğu için açıklama düzenlemesi
        if(currentModule === "waste" || currentModule === "paper" || currentModule === "energy_efficiency" || currentModule === "home_energy"){
             agacAciklamasi = `Bu sayede doğaya kazandırılan ağaç eşdeğeri: ${res.trees} Ağaç.`;
        }

        resultHtml += `
                <div class="result-row mt-3" style="font-size: 20px; color: var(--primary);">
                    <span><i class="fa-solid fa-cloud-arrow-up"></i> Toplam Çevresel Etki / Tasarruf</span>
                    <span>${res.total} ${birim}</span>
                </div>
                <div class="tree-badge">
                    <i class="fa-solid fa-tree"></i>
                    ${agacAciklamasi}
                </div>
            `;

        document.getElementById("resultContent").innerHTML = resultHtml;
        document.getElementById("resultArea").scrollIntoView({ behavior: "smooth", block: "end" });
    }

    document.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
